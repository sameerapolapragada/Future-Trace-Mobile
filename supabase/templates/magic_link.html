<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Future Trace</title>
</head>
<body style="margin:0;padding:0;background:#0a0f1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a0f1a;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#111827;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px;">
          <tr>
            <td style="color:#ffffff;font-size:22px;font-weight:600;padding-bottom:8px;">
              Future Trace
            </td>
          </tr>
          <tr>
            <td style="color:#94a3b8;font-size:14px;line-height:1.6;padding-bottom:24px;">
              Tap the button below to sign in. This link expires shortly.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background:#6366f1;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:14px 28px;border-radius:12px;">
                Sign in
              </a>
            </td>
          </tr>
          <tr>
            <td style="color:#64748b;font-size:12px;line-height:1.6;">
              Requested for <span style="color:#cbd5e1;">{{ .Email }}</span>. If this wasn't you, ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
